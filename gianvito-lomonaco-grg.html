<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto da Visita Digitale - GRG Costruzioni</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            padding: 2rem 1rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ============================================
           CONTENITORE PRINCIPALE DEL BIGLIETTO
           ============================================ */
        
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 400px;
            height: 240px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        /* ============================================
           STILI FRONTE E RETRO
           ============================================ */
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .card-front {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-left: 4px solid #92BE20;
            color: white;
        }

        .card-back {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            transform: rotateY(180deg);
            border-left: 4px solid #92BE20;
            color: white;
        }

        /* ============================================
           SEZIONE FOTO PROFILO
           ============================================ */
        
        .profile-photo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            border: 3px solid #92BE20;
            flex-shrink: 0;
            background: #333;
        }

        .front-content {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            height: 100%;
            flex-direction: row;
        }

        .photo-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        /* ============================================
           SEZIONE INTESTAZIONE
           ============================================ */
        
        .header {
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: center;
            gap: 0.4rem;
        }

        .company-name {
            font-size: 17px;
            font-weight: 600;
            color: #92BE20;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-logo-text {
            max-width: 175px;
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            margin-bottom: 2px;
        }

        .brand-tags {
            font-size: 11px;
            color: #92BE20;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .personal-name {
            font-size: 18px;
            font-weight: 700;
            margin-top: 0.3rem;
        }

        .role {
            font-size: 11px;
            color: #b0b0b0;
            letter-spacing: 0.5px;
        }

        .tagline {
            font-size: 11px;
            color: #92BE20;
            font-weight: 600;
            margin-top: 0.3rem;
        }

        /* ============================================
           FOOTER FRONTE (Tagline)
           ============================================ */
        
        .flip-hint {
            position: absolute;
            bottom: 10px;
            right: 14px;
            font-size: 10px;
            color: #e7e0e0;
            opacity: 0;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* ============================================
           LAYOUT RETRO
           ============================================ */
        
        .back-content-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 1rem;
        }

        .back-header {
            flex-shrink: 0;
        }

        .back-info-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            align-items: start;
            align-content: center;
        }

        .info-column {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            text-align: center;
        }

        .section-title {
            font-size: 12px;
            color: #92BE20;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .back-text {
            font-size: 11px;
            color: #e0e0e0;
            line-height: 1.4;
            white-space: nowrap;
        }

        /* ============================================
           FOOTER CON SOCIAL
           ============================================ */
        
        .back-footer-container {
            flex-shrink: 0;
            padding-top: 1rem;
            border-top: 1px solid rgba(146, 190, 32, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .website-link {
            color: #92BE20;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .premium-partner {
            display: inline-block;
            color: #92BE20;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid #92BE20;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(146,190,32,0.08);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .premium-partner:hover {
            background: #92BE20;
            color: #1a1a1a;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        
        @media (max-width: 600px) {
            .card-container {
                max-width: 100%;
                height: 220px;
            }

            .card-front, .card-back {
                padding: 1.2rem 1.5rem;
            }

            .personal-name {
                font-size: 18px;
            }

            .profile-photo {
                width: 100px;
                height: 100px;
            }

            .back-info-container {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>

    <!-- ========================================

         ======================================== -->
    
    <script>
        // ==========================================
        // FUNZIONE PER GIRARE IL BIGLIETTO
        // ==========================================
        
        const card = document.getElementById('card');
        
        card.addEventListener('click', function(e) {
            // Se il click è su un link (social o sito web), NON girare il biglietto
            if (e.target.closest('a')) return;
            this.classList.toggle('flipped');
        });

        // Supporto per touch su mobile
        card.addEventListener('touchend', function(e) {
            // Se il touch è su un link, lascia funzionare il link
            if (e.target.closest('a')) return;
            e.preventDefault();
            this.classList.toggle('flipped');
        });

        // Blocca la propagazione del click sul sito web per sicurezza
        document.querySelectorAll('.website-link').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.stopPropagation();
            });
            link.addEventListener('touchend', function(e) {
                e.stopPropagation();
            });
        });

        // ==========================================
        // FUNZIONE PER AGGIORNARE I DATI
        // ==========================================
        
        function updateBusinessCard(name, role, email, phone, brandTags = "Competenza che genera valore", photoUrl = null, websiteUrl = "https://www.lci-innovation.it") {
            
            // Fronte
            document.getElementById('userName').textContent = name;
            document.getElementById('userRole').textContent = role;
            document.getElementById('brandTags').textContent = brandTags;
            
            // Retro
            document.getElementById('userEmail').textContent = email;
            document.getElementById('userPhone').textContent = phone;
            
            // Foto
            if (photoUrl) {
                document.getElementById('userPhoto').src = photoUrl;
            }
            
            // Sito web
            document.querySelector('.website-link').href = websiteUrl;
        }

        // ==========================================
        // ESEMPIO DI UTILIZZO
        // ==========================================
